name: Release APK

on:
  push:
    branches:
      - claude/media-tracking-app-YrCEY
    paths:
      - "android/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        # Installs the Gradle version specified in gradle-wrapper.properties and
        # caches dependencies. Lets us run `gradle ...` without needing the
        # checked-in `gradlew` script.
        with:
          gradle-version: wrapper

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
          ls -la android/app/keystore/release.jks

      - name: Write local.properties
        working-directory: android
        env:
          SHELF_API_TOKEN: ${{ secrets.SHELF_API_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_ABS="$(pwd)/app/keystore/release.jks"
          {
            echo "shelf.api.base=https://media.kzaller.com"
            echo "shelf.api.token=${SHELF_API_TOKEN}"
            echo "keystore.path=${KEYSTORE_ABS}"
            echo "keystore.password=${KEYSTORE_PASSWORD}"
            echo "key.alias=${KEY_ALIAS}"
            echo "key.password=${KEY_PASSWORD}"
          } > local.properties

      - name: Build release APK
        working-directory: android
        # `gradle` is provided by setup-gradle@v3 and uses the version pinned in
        # gradle-wrapper.properties. Equivalent to ./gradlew assembleRelease.
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "no APK produced" >&2; exit 1; fi
          NAME="media-shelf-build-${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-shelf-apk
          path: ${{ steps.locate.outputs.apk }}
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated release APK from commit ${{ github.sha }}.
            Install on your phone: open the link on the phone, tap Assets, download the .apk, tap to install.
          prerelease: true
          files: ${{ steps.locate.outputs.apk }}
          fail_on_unmatched_files: true
