<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1560" font-family="system-ui, sans-serif">
  <!-- Option B: an IKEA Kallax-style cubby unit. The whole 2x2 grid is one piece
       of furniture with thick wood dividers, and the four illustrations sit INSIDE
       the cubbies (not floating on top of shelves). -->
  <defs>
    <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#16121d"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c79762"/>
      <stop offset="100%" stop-color="#8a5a30"/>
    </linearGradient>
    <linearGradient id="oakEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a30"/>
      <stop offset="100%" stop-color="#4f311a"/>
    </linearGradient>
    <linearGradient id="cubbyBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f1e"/>
      <stop offset="100%" stop-color="#10080f"/>
    </linearGradient>
    <linearGradient id="bookFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2310"/>
      <stop offset="100%" stop-color="#6b3f1c"/>
    </linearGradient>
    <linearGradient id="movieFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="tvFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#021008"/>
      <stop offset="100%" stop-color="#0f3b22"/>
    </linearGradient>
    <linearGradient id="gameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06021a"/>
      <stop offset="100%" stop-color="#3a0e5c"/>
    </linearGradient>
    <filter id="inset" x="0" y="0" width="100%" height="100%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="720" height="1560" fill="url(#wallB)"/>
  <rect width="720" height="80" fill="rgba(0,0,0,0.3)"/>
  <text x="40" y="50" fill="#888" font-size="22">11:34</text>
  <text x="640" y="50" fill="#888" font-size="22">86%</text>

  <text x="48" y="170" fill="#e5c07b" font-size="44" font-weight="900" letter-spacing="6">MEDIA</text>
  <text x="48" y="220" fill="#e8e8ea" font-size="32" font-weight="300" letter-spacing="2">shelf</text>

  <!-- ============== Cubby unit ============== -->
  <g transform="translate(40, 300)">
    <!-- outer frame (top + sides + bottom + center cross) -->
    <!-- top -->
    <rect x="0" y="0" width="640" height="20" fill="url(#oak)"/>
    <!-- bottom -->
    <rect x="0" y="940" width="640" height="20" fill="url(#oak)"/>
    <rect x="0" y="960" width="640" height="12" fill="url(#oakEdge)"/>
    <!-- left side -->
    <rect x="0" y="0" width="22" height="960" fill="url(#oak)"/>
    <!-- right side -->
    <rect x="618" y="0" width="22" height="960" fill="url(#oak)"/>
    <!-- horizontal divider -->
    <rect x="22" y="470" width="596" height="22" fill="url(#oak)"/>
    <!-- vertical divider -->
    <rect x="309" y="20" width="22" height="920" fill="url(#oak)"/>

    <!-- ============== Cubby contents ============== -->
    <!-- Top-left: Books (cubby = 22..309 x 20..470) -->
    <rect x="22" y="20" width="287" height="450" fill="url(#cubbyBack)"/>
    <rect x="22" y="20" width="287" height="450" fill="url(#bookFill)" opacity="0.75"/>
    <!-- book spines in the cubby. All bottom-align inside the cubby (cubby is 22..309 x 20..470).
         Tallest is 200, shortest 150; all rest on y=205 cubby-relative (= y=465 absolute). -->
    <g transform="translate(40, 260)">
      <rect x="0"   y="35"  width="34" height="170" fill="#b54b2a"/>
      <rect x="36"  y="15"  width="34" height="190" fill="#e3b25a"/>
      <rect x="72"  y="55"  width="34" height="150" fill="#6e3018"/>
      <rect x="108" y="25"  width="34" height="180" fill="#c9824a"/>
      <rect x="144" y="45"  width="34" height="160" fill="#8a4520"/>
      <rect x="180" y="5"   width="34" height="200" fill="#e9d4a5"/>
      <rect x="216" y="35"  width="34" height="170" fill="#7c3b18"/>
    </g>
    <!-- cubby floor line so the books look like they are resting on something -->
    <line x1="22" y1="468" x2="309" y2="468" stroke="rgba(0,0,0,0.6)" stroke-width="2"/>
    <!-- inset cubby shadow -->
    <rect x="22" y="20" width="287" height="450" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="6"/>
    <text x="42" y="68" fill="#e5c07b" font-size="32" font-weight="900" font-family="Georgia, serif">Books</text>
    <text x="42" y="92" fill="rgba(255,255,255,0.7)" font-size="14">Read &amp; to read</text>
    <rect x="252" y="38" width="44" height="26" rx="13" fill="rgba(0,0,0,0.55)"/>
    <text x="274" y="56" fill="#e5c07b" font-size="14" text-anchor="middle" font-weight="900">12</text>

    <!-- Top-right: Movies (331..618 x 20..470) -->
    <rect x="331" y="20" width="287" height="450" fill="url(#cubbyBack)"/>
    <rect x="331" y="20" width="287" height="450" fill="url(#movieFill)" opacity="0.85"/>
    <!-- bulbs -->
    <g transform="translate(360, 420)">
      <circle cx="0"   cy="0" r="7" fill="#ffd56b"/>
      <circle cx="40"  cy="0" r="7" fill="#ffd56b"/>
      <circle cx="80"  cy="0" r="7" fill="#ffd56b"/>
      <circle cx="120" cy="0" r="7" fill="#ffd56b"/>
      <circle cx="160" cy="0" r="7" fill="#ffd56b"/>
      <circle cx="200" cy="0" r="7" fill="#ffd56b"/>
      <circle cx="240" cy="0" r="7" fill="#ffd56b"/>
    </g>
    <!-- stars -->
    <circle cx="430" cy="150" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="490" cy="180" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="560" cy="160" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="600" cy="220" r="1.5" fill="white" opacity="0.6"/>
    <!-- film strip left -->
    <rect x="331" y="20" width="18" height="450" fill="#050714"/>
    <rect x="334" y="40" width="11" height="20" fill="black"/>
    <rect x="334" y="80" width="11" height="20" fill="black"/>
    <rect x="334" y="120" width="11" height="20" fill="black"/>
    <rect x="334" y="160" width="11" height="20" fill="black"/>
    <rect x="334" y="200" width="11" height="20" fill="black"/>
    <rect x="334" y="240" width="11" height="20" fill="black"/>
    <rect x="334" y="280" width="11" height="20" fill="black"/>
    <rect x="334" y="320" width="11" height="20" fill="black"/>
    <rect x="334" y="360" width="11" height="20" fill="black"/>
    <rect x="334" y="400" width="11" height="20" fill="black"/>
    <rect x="334" y="440" width="11" height="20" fill="black"/>

    <rect x="331" y="20" width="287" height="450" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="6"/>
    <text x="362" y="68" fill="#e4c46b" font-size="32" font-weight="900" font-style="italic" font-family="Georgia, serif">Movies</text>
    <text x="362" y="92" fill="rgba(255,255,255,0.7)" font-size="14">Big screen, small screen</text>
    <rect x="561" y="38" width="44" height="26" rx="13" fill="rgba(0,0,0,0.55)"/>
    <text x="583" y="56" fill="#e4c46b" font-size="14" text-anchor="middle" font-weight="900">7</text>

    <!-- Bottom-left: TV (22..309 x 492..940) -->
    <rect x="22" y="492" width="287" height="448" fill="url(#cubbyBack)"/>
    <rect x="22" y="492" width="287" height="448" fill="url(#tvFill)" opacity="0.85"/>
    <!-- color bars at bottom of cubby -->
    <g transform="translate(22, 730)">
      <rect x="0"   y="0" width="41" height="200" fill="#c0c0c0" opacity="0.78"/>
      <rect x="41"  y="0" width="41" height="200" fill="#c0c000" opacity="0.78"/>
      <rect x="82"  y="0" width="41" height="200" fill="#00c0c0" opacity="0.78"/>
      <rect x="123" y="0" width="41" height="200" fill="#00c000" opacity="0.78"/>
      <rect x="164" y="0" width="40" height="200" fill="#c000c0" opacity="0.78"/>
      <rect x="204" y="0" width="40" height="200" fill="#c00000" opacity="0.78"/>
      <rect x="244" y="0" width="45" height="200" fill="#0000c0" opacity="0.78"/>
    </g>
    <!-- scanlines -->
    <g opacity="0.18">
      <line x1="22" y1="540" x2="309" y2="540" stroke="black"/>
      <line x1="22" y1="550" x2="309" y2="550" stroke="black"/>
      <line x1="22" y1="560" x2="309" y2="560" stroke="black"/>
      <line x1="22" y1="570" x2="309" y2="570" stroke="black"/>
    </g>
    <rect x="22" y="492" width="287" height="448" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="6"/>
    <text x="42" y="540" fill="#52ff8a" font-size="32" font-weight="900" font-family="monospace" letter-spacing="2">TV</text>
    <text x="42" y="564" fill="rgba(255,255,255,0.7)" font-size="14">Series &amp; seasons</text>
    <rect x="252" y="510" width="44" height="26" rx="13" fill="rgba(0,0,0,0.55)"/>
    <text x="274" y="528" fill="#52ff8a" font-size="14" text-anchor="middle" font-weight="900">5</text>

    <!-- Bottom-right: Games (331..618 x 492..940) -->
    <rect x="331" y="492" width="287" height="448" fill="url(#cubbyBack)"/>
    <rect x="331" y="492" width="287" height="448" fill="url(#gameFill)" opacity="0.9"/>
    <circle cx="475" cy="780" r="56" fill="#ffb6e0"/>
    <rect x="419" y="785" width="112" height="6" fill="#180a3c"/>
    <rect x="419" y="800" width="112" height="6" fill="#180a3c"/>
    <rect x="419" y="815" width="112" height="6" fill="#180a3c"/>
    <line x1="331" y1="830" x2="618" y2="830" stroke="#ff3dbe" stroke-width="2" opacity="0.7"/>
    <g stroke="#34e0ff" stroke-width="1.4" opacity="0.55">
      <line x1="395" y1="830" x2="331" y2="940"/>
      <line x1="427" y1="830" x2="375" y2="940"/>
      <line x1="459" y1="830" x2="425" y2="940"/>
      <line x1="491" y1="830" x2="475" y2="940"/>
      <line x1="523" y1="830" x2="525" y2="940"/>
      <line x1="555" y1="830" x2="575" y2="940"/>
    </g>
    <g stroke="#ff3dbe" stroke-width="1.4" opacity="0.45">
      <line x1="331" y1="860" x2="618" y2="860"/>
      <line x1="331" y1="895" x2="618" y2="895"/>
    </g>
    <rect x="331" y="492" width="287" height="448" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="6"/>
    <text x="362" y="540" fill="#ff3dbe" font-size="32" font-weight="900">Games</text>
    <text x="362" y="564" fill="rgba(255,255,255,0.7)" font-size="14">Played &amp; in the backlog</text>
    <rect x="561" y="510" width="44" height="26" rx="13" fill="rgba(0,0,0,0.55)"/>
    <text x="583" y="528" fill="#ff3dbe" font-size="14" text-anchor="middle" font-weight="900">3</text>
  </g>
</svg>
