<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icon 1: cluster of media items on a dark backdrop.
       Communicates "this app holds all your stuff in one place." -->
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1f1a2a"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </radialGradient>
    <linearGradient id="book1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7a44b"/>
      <stop offset="100%" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="film1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a40"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="pad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff52c6"/>
      <stop offset="100%" stop-color="#9a1a73"/>
    </linearGradient>
    <linearGradient id="tv1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52ff8a"/>
      <stop offset="100%" stop-color="#0f3b22"/>
    </linearGradient>
  </defs>

  <!-- adaptive icon background fills the full 512 -->
  <rect width="512" height="512" fill="url(#bg1)"/>

  <!-- subtle inner glow ring -->
  <circle cx="256" cy="240" r="180" fill="none" stroke="#e5c07b" stroke-width="2" opacity="0.10"/>

  <!-- Book (front-left), rotated ~ -8deg -->
  <g transform="translate(150, 200) rotate(-8)">
    <rect x="0" y="0" width="120" height="170" rx="6" fill="url(#book1)"/>
    <rect x="0" y="0" width="14" height="170" fill="#5a3814"/>
    <line x1="35" y1="40" x2="100" y2="40" stroke="#5a3814" stroke-width="3"/>
    <line x1="35" y1="60" x2="100" y2="60" stroke="#5a3814" stroke-width="2"/>
    <line x1="35" y1="80" x2="100" y2="80" stroke="#5a3814" stroke-width="2"/>
  </g>

  <!-- TV (back-center) -->
  <g transform="translate(208, 138)">
    <rect x="0" y="0" width="160" height="115" rx="10" fill="#0a1810"/>
    <rect x="8" y="8" width="144" height="92" rx="4" fill="url(#tv1)" opacity="0.85"/>
    <!-- a stand -->
    <rect x="62" y="115" width="36" height="14" rx="3" fill="#0a1810"/>
    <rect x="40" y="129" width="80" height="6" rx="2" fill="#0a1810"/>
  </g>

  <!-- Film reel (top-right), rotated -->
  <g transform="translate(335, 145) rotate(15)">
    <circle cx="0" cy="0" r="60" fill="url(#film1)"/>
    <circle cx="0" cy="0" r="14" fill="#0a0a14"/>
    <circle cx="0" cy="-35" r="10" fill="#0a0a14"/>
    <circle cx="30" cy="-18" r="10" fill="#0a0a14"/>
    <circle cx="30" cy="18" r="10" fill="#0a0a14"/>
    <circle cx="0" cy="35" r="10" fill="#0a0a14"/>
    <circle cx="-30" cy="18" r="10" fill="#0a0a14"/>
    <circle cx="-30" cy="-18" r="10" fill="#0a0a14"/>
  </g>

  <!-- Game pad (front-right), rotated -->
  <g transform="translate(280, 290) rotate(6)">
    <!-- body -->
    <path d="M-90 0 Q-100 -40 -50 -38 L50 -38 Q100 -40 90 0 Q88 32 60 32 L-60 32 Q-88 32 -90 0 Z" fill="url(#pad1)"/>
    <!-- d-pad -->
    <rect x="-66" y="-12" width="26" height="8" rx="2" fill="#3a052a"/>
    <rect x="-57" y="-21" width="8" height="26" rx="2" fill="#3a052a"/>
    <!-- buttons -->
    <circle cx="55" cy="-12" r="6" fill="#34e0ff"/>
    <circle cx="40" cy="2" r="6" fill="#34e0ff"/>
    <circle cx="70" cy="2" r="6" fill="#34e0ff"/>
    <circle cx="55" cy="16" r="6" fill="#34e0ff"/>
  </g>

  <!-- a small "shelf" line under it all -->
  <rect x="64" y="380" width="384" height="14" rx="3" fill="#7a4a22"/>
  <rect x="64" y="394" width="384" height="6" fill="#3a1d0c"/>
</svg>
