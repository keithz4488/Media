<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" font-family="Georgia, serif">
  <!-- Icon 2: monogram "M" with a small underline shelf. Brand-mark style,
       reads instantly at small sizes (notifications, app drawer). -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#231a32"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d489"/>
      <stop offset="100%" stop-color="#b88634"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg2)"/>

  <!-- M -->
  <text x="256" y="320" text-anchor="middle" font-size="320" font-weight="900" fill="url(#gold2)">M</text>

  <!-- accent dot under the M (like a serif period in a logotype) -->
  <circle cx="256" cy="370" r="10" fill="#ff3dbe"/>

  <!-- shelf -->
  <rect x="120" y="395" width="272" height="14" rx="3" fill="#7a4a22"/>
  <rect x="120" y="409" width="272" height="6" fill="#3a1d0c"/>

  <!-- tiny brackets -->
  <path d="M132 415 L132 430 L150 430 Z" fill="#3a1d0c"/>
  <path d="M380 415 L380 430 L362 430 Z" fill="#3a1d0c"/>
</svg>
