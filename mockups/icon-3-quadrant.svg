<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" font-family="system-ui, sans-serif">
  <!-- Icon 3: four-quadrant tile mosaic. Each quadrant is a category with its
       signature color + one tiny iconic element.  Communicates "four shelves"
       at a glance. -->
  <defs>
    <linearGradient id="qBook" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4422"/>
      <stop offset="100%" stop-color="#3a1d0c"/>
    </linearGradient>
    <linearGradient id="qMovie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#050714"/>
    </linearGradient>
    <linearGradient id="qTv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3b22"/>
      <stop offset="100%" stop-color="#021008"/>
    </linearGradient>
    <linearGradient id="qGame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0e5c"/>
      <stop offset="100%" stop-color="#06021a"/>
    </linearGradient>
  </defs>

  <!-- 2x2 quadrants -->
  <rect x="0"   y="0"   width="256" height="256" fill="url(#qBook)"/>
  <rect x="256" y="0"   width="256" height="256" fill="url(#qMovie)"/>
  <rect x="0"   y="256" width="256" height="256" fill="url(#qTv)"/>
  <rect x="256" y="256" width="256" height="256" fill="url(#qGame)"/>

  <!-- inner glyphs -->
  <!-- Books: 3 spines -->
  <g transform="translate(80, 70)">
    <rect x="0"  y="20" width="28" height="120" fill="#b54b2a"/>
    <rect x="34" y="0"  width="28" height="140" fill="#e3b25a"/>
    <rect x="68" y="40" width="28" height="100" fill="#6e3018"/>
  </g>

  <!-- Movies: marquee bulbs -->
  <g transform="translate(300, 130)">
    <circle cx="0"  cy="0" r="9" fill="#ffd56b"/>
    <circle cx="30" cy="0" r="9" fill="#ffd56b"/>
    <circle cx="60" cy="0" r="9" fill="#ffd56b"/>
    <circle cx="90" cy="0" r="9" fill="#ffd56b"/>
    <circle cx="120" cy="0" r="9" fill="#ffd56b"/>
    <circle cx="150" cy="0" r="9" fill="#ffd56b"/>
    <circle cx="0"  cy="35" r="9" fill="#ffd56b"/>
    <circle cx="30" cy="35" r="9" fill="#ffd56b"/>
    <circle cx="60" cy="35" r="9" fill="#ffd56b"/>
    <circle cx="90" cy="35" r="9" fill="#ffd56b"/>
    <circle cx="120" cy="35" r="9" fill="#ffd56b"/>
    <circle cx="150" cy="35" r="9" fill="#ffd56b"/>
  </g>

  <!-- TV: color bars -->
  <g transform="translate(56, 330)">
    <rect x="0"   y="0" width="20" height="130" fill="#c0c0c0" opacity="0.85"/>
    <rect x="20"  y="0" width="20" height="130" fill="#c0c000" opacity="0.85"/>
    <rect x="40"  y="0" width="20" height="130" fill="#00c0c0" opacity="0.85"/>
    <rect x="60"  y="0" width="20" height="130" fill="#00c000" opacity="0.85"/>
    <rect x="80"  y="0" width="20" height="130" fill="#c000c0" opacity="0.85"/>
    <rect x="100" y="0" width="20" height="130" fill="#c00000" opacity="0.85"/>
    <rect x="120" y="0" width="24" height="130" fill="#0000c0" opacity="0.85"/>
  </g>

  <!-- Games: retro sun -->
  <g transform="translate(384, 380)">
    <circle cx="0" cy="0" r="60" fill="#ffb6e0"/>
    <rect x="-60" y="5" width="120" height="6" fill="#3a0e5c"/>
    <rect x="-60" y="20" width="120" height="6" fill="#3a0e5c"/>
    <rect x="-60" y="35" width="120" height="6" fill="#3a0e5c"/>
  </g>

  <!-- center accent: a small horizontal "+" shelf where they meet -->
  <rect x="246" y="0"   width="20" height="512" fill="#1a1018" opacity="0.6"/>
  <rect x="0"   y="246" width="512" height="20" fill="#1a1018" opacity="0.6"/>
</svg>
